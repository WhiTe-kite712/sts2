<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>豪 · 骨骼动作预览</title>
<style>
:root{font-family:"Microsoft YaHei UI","Microsoft YaHei",system-ui,sans-serif;color:#e9f1ff;background:#0a0f1a;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:28px 24px 36px;background:radial-gradient(ellipse at 20% 0,#142840 0,transparent 45%),#0a0f1a}main{max-width:1080px;margin:auto}.heading{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:0 0 20px}.eyebrow{color:#77baff;font-size:12px;letter-spacing:.16em;margin:0 0 8px}h1{font-size:28px;font-weight:650;letter-spacing:.02em;margin:0}.sub{color:#92a3bc;font-size:13px;line-height:1.5;margin:0;text-align:right}.panel{border:1px solid #243249;border-radius:20px;background:#111a29;box-shadow:0 20px 80px #0004;overflow:hidden}.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;background:#101827;border-bottom:1px solid #243249}.seg{display:flex;gap:5px;padding:4px;background:#080f1b;border:1px solid #263349;border-radius:12px}button,select{font:inherit}button{cursor:pointer;border:1px solid #304159;color:#d3e2f8;border-radius:9px;background:#18243a;padding:9px 14px;transition:background .15s,border-color .15s}button:hover{background:#223756;border-color:#5388bb}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #8ccdff;outline-offset:3px}.seg button{border-color:transparent;background:transparent;min-width:110px}.seg button[aria-pressed="true"]{background:#244e78;color:#fff;box-shadow:inset 0 0 0 1px #477eb2}.options{display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-size:13px;color:#bac9dc}label{display:flex;align-items:center;gap:7px;cursor:pointer}input[type="checkbox"]{accent-color:#79beff;width:15px;height:15px}select{color:#e7f2ff;background:#0b1422;border:1px solid #354861;padding:6px 9px;border-radius:7px}.stage{position:relative;width:100%;background:#0b111e}.stage.checker{background-color:#192536;background-image:linear-gradient(45deg,#253244 25%,transparent 25%),linear-gradient(-45deg,#253244 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#253244 75%),linear-gradient(-45deg,transparent 75%,#253244 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0}canvas{display:block;width:100%;height:auto;aspect-ratio:900/650}.stage-note{position:absolute;top:16px;left:20px;color:#b6c6db;font-size:12px;pointer-events:none;background:#09121bcc;border:1px solid #283b52;padding:6px 10px;border-radius:20px}.state-note{position:absolute;top:16px;right:20px;color:#7ec5ff;font-size:12px;background:#09121bcc;padding:6px 10px;border:1px solid #283b52;border-radius:20px;pointer-events:none}.controls{padding:20px;background:#101827;border-top:1px solid #243249}.control-row{display:flex;align-items:center;gap:14px;margin-bottom:17px}#play{min-width:100px;background:#2c638f;border-color:#4a85b2;color:#fff;font-weight:600}.readout{font-size:14px;font-variant-numeric:tabular-nums;letter-spacing:.03em;color:#d0dfef}.frame{color:#798ea9;font-size:12px;margin-left:10px}#event-jump{margin-left:auto;color:#8acbff;background:#132638;border-color:#2b526e;font-size:12px;padding:7px 11px}.timeline{position:relative;padding-bottom:16px}input[type="range"]{display:block;width:100%;margin:0;accent-color:#79beff;cursor:pointer;height:20px}.event-marker{position:absolute;top:22px;width:1px;height:8px;background:#6abaf5;pointer-events:none}.event-marker span{position:absolute;top:9px;left:0;transform:translateX(-50%);font-size:10px;color:#799ab7;white-space:nowrap}.timeline-labels{display:flex;justify-content:space-between;font-size:11px;color:#7890ad;pointer-events:none;margin-top:20px}.footer{display:flex;justify-content:space-between;gap:16px;margin-top:14px;color:#6d829f;font-size:11px;line-height:1.6}.error{color:#ffd6bf;background:#321f1b;border:1px solid #73483a;padding:14px 20px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:650px){body{padding:16px 10px 24px}.heading{align-items:start}h1{font-size:22px}.sub{font-size:11px;max-width:150px}.toolbar{padding:12px}.options{gap:10px}.controls{padding:14px}.frame{display:none}.seg button{min-width:95px}.stage-note{left:10px;top:10px}.state-note{right:10px;top:10px}.footer{flex-direction:column;gap:2px}#event-jump{max-width:135px}.readout{font-size:12px}}
</style>
</head>
<body>
<main>
<header class="heading"><div><p class="eyebrow">HAO / MOTION STUDY</p><h1>豪 · 动作预览</h1></div><p class="sub">攻击与能力牌施法<br>拖动时间轴，查看每一帧姿态</p></header>
<section class="panel" aria-label="骨骼动画预览">
<div class="toolbar"><div class="seg" role="group" aria-label="选择动作"><button data-animation="attack" aria-pressed="true">攻击 · Attack</button><button data-animation="cast" aria-pressed="false">施法 · Cast</button></div><div class="options"><label>速度<select id="speed" aria-label="播放速度"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><label><input id="loop" type="checkbox" checked>循环</label><label><input id="bones" type="checkbox">显示骨骼</label><label><input id="backdrop" type="checkbox">透明底纹</label></div></div>
<div id="stage" class="stage"><canvas id="canvas" width="900" height="650" role="img" aria-label="金发少年剑士的攻击骨骼动画"></canvas><span class="stage-note" id="stage-note">正在载入图集…</span><span class="state-note" id="state-note">面朝右</span></div>
<div class="controls"><div class="control-row"><button id="play" aria-label="暂停动画">暂停</button><span class="readout"><span id="time">0.000</span> / <span id="duration">1.000</span> 秒<span class="frame" id="frame">第 0 帧</span></span><button id="event-jump" title="暂停并跳到事件时间">命中 · 0.400秒</button></div><div class="timeline"><label for="scrub" class="sr-only">动画时间</label><input id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="动画时间轴"><div class="event-marker" id="event-marker"><span id="event-label">命中</span></div><div class="timeline-labels"><span>0.000s</span><span id="end-label">1.000s</span></div></div></div>
<div id="error" class="error" hidden role="alert"></div>
</section>
<footer class="footer"><span>本地离线预览 · 图集与 Spine 时间线已嵌入 · 空格播放/暂停，← → 单帧查看</span><span id="source-info">900 × 650 · 原点 (330, 580)</span></footer>
</main>
<script type="application/json" id="spine-data">__SPINE_JSON__</script>
<script type="application/json" id="region-data">__REGIONS_JSON__</script>
<script type="application/json" id="source-meta">__SOURCE_META__</script>
<script>
"use strict";
(() => {
const data=JSON.parse(document.getElementById('spine-data').textContent),regions=JSON.parse(document.getElementById('region-data').textContent),sourceMeta=JSON.parse(document.getElementById('source-meta').textContent);
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),stage=document.getElementById('stage'),scrub=document.getElementById('scrub'),play=document.getElementById('play'),speed=document.getElementById('speed'),showBones=document.getElementById('bones'),loop=document.getElementById('loop');
const W=900,H=650,ORIGIN=[330,580],SCALE=1,DEG=Math.PI/180;
const image=new Image(),skins=Array.isArray(data.skins)?data.skins:Object.entries(data.skins||{}).map(([name,attachments])=>({name,attachments})),skin=skins.find(s=>s.name==='default')||skins[0];
const boneMap=new Map(data.bones.map(b=>[b.name,b])),durations={};
let animation='attack',time=0,playing=true,ready=false,last=0,error=null;
const clamp=(v,min,max)=>Math.max(min,Math.min(max,v));
function durationOf(value){let end=0;function visit(v){if(Array.isArray(v))for(const item of v){if(item&&typeof item.time==='number')end=Math.max(end,item.time);visit(item);}else if(v&&typeof v==='object')for(const item of Object.values(v))visit(item);}visit(value);return end;}
for(const [name,a]of Object.entries(data.animations))durations[name]=durationOf(a);
function fail(message){error=String(message);playing=false;document.getElementById('error').hidden=false;document.getElementById('error').textContent='预览无法载入：'+error;document.getElementById('stage-note').textContent='载入失败';updateUI();}
function validateSource(){
if(!skin||!data.bones.length)throw new Error('源文件缺少骨骼或默认皮肤');
for(const bone of data.bones){if(bone.parent&&!boneMap.has(bone.parent))throw new Error('未找到父骨骼：'+bone.parent);if(bone.inherit&&bone.inherit!=='normal')throw new Error('当前预览未实现此骨骼继承模式：'+bone.inherit);}
for(const slot of data.slots){if(!boneMap.has(slot.bone))throw new Error('插槽骨骼不存在：'+slot.bone);const c=slot.color||'ffffffff';if(c.slice(0,6).toLowerCase()!=='ffffff')throw new Error('源文件含未实现的插槽颜色染色');for(const att of Object.values(skin.attachments[slot.name]||{})){if(att.type&&att.type!=='region')throw new Error('当前预览仅支持本源文件中的区域附件');if(!regions[att.path||att.name||slot.attachment])throw new Error('缺少图集区域：'+(att.path||slot.attachment));}}
for(const [name,a]of Object.entries(data.animations)){for(const [bone,tracks]of Object.entries(a.bones||{})){if(!boneMap.has(bone))throw new Error('时间线骨骼不存在：'+bone);for(const [kind,frames]of Object.entries(tracks)){if(!['rotate','translate','scale','shear'].includes(kind))throw new Error('未实现的骨骼时间线：'+kind);for(const frame of frames)if(frame.curve&&frame.curve!=='stepped')throw new Error('当前源文件应为逐帧烘焙的线性时间线');}}for(const tracks of Object.values(a.slots||{}))for(const kind of Object.keys(tracks))if(!['alpha','attachment'].includes(kind))throw new Error('未实现的插槽时间线：'+kind);if(a.ik||a.transform||a.path||a.deform)throw new Error('当前预览需要已烘焙的骨骼时间线');if(!durations[name])throw new Error('动作时长为空：'+name);}
}
// Timeline values are offsets for bones and absolute values for slot alpha.
function sample(frames,t,key,fallback){if(!frames||!frames.length||t<(frames[0].time||0))return fallback;let a=frames[0];for(let i=1;i<frames.length;i++){const b=frames[i],ta=a.time||0,tb=b.time||0;if(t<tb){const va=a[key]??fallback,vb=b[key]??fallback;if(a.curve==='stepped'||tb===ta)return va;return va+(vb-va)*clamp((t-ta)/(tb-ta),0,1);}a=b;}return a[key]??fallback;}
function discrete(frames,t,fallback){let result=fallback;for(const f of frames||[]){if((f.time||0)>t)break;result=f.name??null;}return result;}
function mul(p,m){return {a:p.a*m.a+p.c*m.b,b:p.b*m.a+p.d*m.b,c:p.a*m.c+p.c*m.d,d:p.b*m.c+p.d*m.d,x:p.a*m.x+p.c*m.y+p.x,y:p.b*m.x+p.d*m.y+p.y};}
function poseAt(name,t){const a=data.animations[name];if(!a)throw new Error('动作不存在：'+name);const world=new Map(),local=new Map(),visiting=new Set();function calc(b){if(world.has(b.name))return world.get(b.name);if(visiting.has(b.name))throw new Error('骨骼层级循环');visiting.add(b.name);const tracks=a.bones?.[b.name]||{},r=(b.rotation||0)+sample(tracks.rotate,t,'value',0),sx=(b.scaleX??1)*sample(tracks.scale,t,'x',1),sy=(b.scaleY??1)*sample(tracks.scale,t,'y',1),shx=(b.shearX||0)+sample(tracks.shear,t,'x',0),shy=(b.shearY||0)+sample(tracks.shear,t,'y',0),m={a:Math.cos((r+shx)*DEG)*sx,b:Math.sin((r+shx)*DEG)*sx,c:Math.cos((r+90+shy)*DEG)*sy,d:Math.sin((r+90+shy)*DEG)*sy,x:(b.x||0)+sample(tracks.translate,t,'x',0),y:(b.y||0)+sample(tracks.translate,t,'y',0)};local.set(b.name,{x:m.x,y:m.y,rotation:r,scaleX:sx,scaleY:sy});const result=b.parent?mul(calc(boneMap.get(b.parent)),m):m;world.set(b.name,result);visiting.delete(b.name);return result;}for(const b of data.bones)calc(b);const slots=data.slots.map(s=>{const tracks=a.slots?.[s.name]||{},setupAlpha=parseInt((s.color||'ffffffff').slice(6,8),16)/255;return {name:s.name,bone:s.bone,attachment:discrete(tracks.attachment,t,s.attachment??null),alpha:clamp(sample(tracks.alpha,t,'value',setupAlpha),0,1),blend:s.blend||'normal'};});return {world,local,slots};}
function slotOrder(a,t,slots){const timeline=a.drawOrder||a.draworder;if(!timeline?.length)return slots;let key=null;for(const k of timeline){if((k.time||0)>t)break;key=k;}if(!key?.offsets)return slots;const ordered=Array(slots.length).fill(null),unchanged=[];let original=0;for(const off of key.offsets){const target=slots.findIndex(s=>s.name===off.slot);while(original<target)unchanged.push(original++);ordered[original+off.offset]=original++;}while(original<slots.length)unchanged.push(original++);for(let i=ordered.length-1;i>=0;i--)if(ordered[i]===null)ordered[i]=unchanged.pop();return ordered.map(i=>slots[i]);}
function render(){if(!ready)return;const dpr=window.devicePixelRatio||1;if(canvas.width!==Math.round(W*dpr)||canvas.height!==Math.round(H*dpr)){canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);ctx.save();ctx.fillStyle='rgba(2,5,10,.52)';ctx.beginPath();ctx.ellipse(337.5,581.5,137.5,17.5,0,0,Math.PI*2);ctx.fill();ctx.restore();const pose=poseAt(animation,time),a=data.animations[animation];for(const slot of slotOrder(a,time,pose.slots)){if(!slot.attachment||slot.alpha<=0)continue;const att=skin.attachments[slot.name]?.[slot.attachment];if(!att)continue;const source=regions[att.path||slot.attachment],m=pose.world.get(slot.bone);ctx.save();ctx.globalAlpha=slot.alpha*(att.color?parseInt(att.color.slice(6,8),16)/255:1);ctx.globalCompositeOperation=slot.blend==='additive'?'lighter':slot.blend==='multiply'?'multiply':slot.blend==='screen'?'screen':'source-over';ctx.translate(ORIGIN[0],ORIGIN[1]);ctx.scale(SCALE,-SCALE);ctx.transform(m.a,m.b,m.c,m.d,m.x,m.y);ctx.translate(att.x||0,att.y||0);ctx.rotate((att.rotation||0)*DEG);ctx.scale(att.scaleX??1,-(att.scaleY??1));ctx.drawImage(image,source.x,source.y,source.width,source.height,-att.width/2,-att.height/2,att.width,att.height);ctx.restore();}if(showBones.checked){ctx.save();ctx.strokeStyle='rgba(255,220,95,.88)';ctx.lineWidth=1.7;ctx.fillStyle='#fff0ad';for(const bone of data.bones){const p=pose.world.get(bone.name),x=ORIGIN[0]+p.x*SCALE,y=ORIGIN[1]-p.y*SCALE;if(bone.parent){const q=pose.world.get(bone.parent);ctx.beginPath();ctx.moveTo(ORIGIN[0]+q.x*SCALE,ORIGIN[1]-q.y*SCALE);ctx.lineTo(x,y);ctx.stroke();}ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();}ctx.restore();}updateUI();}
function eventOf(){return (data.animations[animation].events||[])[0]||null;}
function updateUI(){const duration=durations[animation]||0;document.getElementById('time').textContent=time.toFixed(3);document.getElementById('duration').textContent=duration.toFixed(3);document.getElementById('frame').textContent='第 '+Math.round(time*30)+' 帧';scrub.max=duration;scrub.value=time;scrub.setAttribute('aria-valuetext',time.toFixed(3)+'秒');play.textContent=playing?'暂停':'播放';play.setAttribute('aria-label',playing?'暂停动画':'播放动画');const event=eventOf(),eventText=event?.name==='hit'?'命中':event?.name==='release'?'释放':event?.name||'事件';if(event){document.getElementById('event-jump').textContent=eventText+' · '+event.time.toFixed(3)+'秒';document.getElementById('event-label').textContent=eventText;document.getElementById('event-marker').style.left=clamp(event.time/duration*100,0,100)+'%';document.getElementById('event-marker').hidden=false;}else document.getElementById('event-marker').hidden=true;document.getElementById('end-label').textContent=duration.toFixed(3)+'s';for(const b of document.querySelectorAll('[data-animation]'))b.setAttribute('aria-pressed',String(b.dataset.animation===animation));canvas.setAttribute('aria-label','金发少年剑士的'+(animation==='attack'?'攻击':'施法')+'骨骼动画');document.getElementById('state-note').textContent=event&&Math.abs(time-event.time)<.05?eventText+'时刻':'面朝右';}
function select(name){animation=name;time=0;last=performance.now();updateUI();render();}
function tick(now){const dt=last?Math.min((now-last)/1000,.1):0;last=now;if(ready&&playing&&!error){time+=dt*Number(speed.value);if(time>=durations[animation]){if(loop.checked)time%=durations[animation];else{time=durations[animation];playing=false;}}render();}requestAnimationFrame(tick);}
for(const b of document.querySelectorAll('[data-animation]'))b.addEventListener('click',()=>select(b.dataset.animation));play.addEventListener('click',()=>{if(!ready||error)return;if(time>=durations[animation])time=0;playing=!playing;last=performance.now();render();});scrub.addEventListener('input',()=>{playing=false;time=Number(scrub.value);render();});showBones.addEventListener('change',render);document.getElementById('backdrop').addEventListener('change',e=>stage.classList.toggle('checker',e.target.checked));document.getElementById('event-jump').addEventListener('click',()=>{const e=eventOf();if(!e)return;playing=false;time=e.time;render();});document.addEventListener('keydown',e=>{if(e.target.matches('input,select,button'))return;if(e.code==='Space'){e.preventDefault();play.click();}else if(e.code==='ArrowLeft'||e.code==='ArrowRight'){e.preventDefault();playing=false;time=clamp(time+(e.code==='ArrowRight'?1:-1)/30,0,durations[animation]);render();}});window.addEventListener('resize',render);
window.haoViewer={sourceMeta,durations,poseAt(name,t){const p=poseAt(name,t);return {world:Object.fromEntries(p.world),local:Object.fromEntries(p.local),slots:p.slots};},renderFrame(name,t){if(!data.animations[name])throw new Error('未知动作');animation=name;playing=false;time=clamp(t,0,durations[name]);render();return this.poseAt(name,time);},getState(){return {animation,time,playing,speed:Number(speed.value),showBones:showBones.checked,ready,error};}};
try{validateSource();image.onload=()=>{try{for(const [name,r]of Object.entries(regions))if(r.x<0||r.y<0||r.x+r.width>image.width||r.y+r.height>image.height)throw new Error('图集区域超出PNG：'+name);ready=true;document.getElementById('stage-note').textContent='骨骼动画 · '+data.skeleton.spine;document.getElementById('source-info').textContent=data.bones.length+' 骨骼 · '+data.slots.length+' 插槽 · 900 × 650';last=performance.now();render();}catch(e){fail(e.message);}};image.onerror=()=>fail('内嵌PNG无法解码');image.src='__ATLAS_DATA_URI__';requestAnimationFrame(tick);}catch(e){fail(e.message);}
})();
</script>
</body>
</html>
